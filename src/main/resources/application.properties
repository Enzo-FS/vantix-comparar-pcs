server.port=${PORT:8080}

# Banco de dados MySQL 8 (rode database/schema.sql e database/seed.sql antes).
# Em producao, defina as variaveis de ambiente DB_URL, DB_USER e DB_PASSWORD (veja docs/CONFIGURAR_MYSQL.md).
# connectionTimeZone + forceConnectionTimeZoneToSession: NOW()/CURRENT_TIMESTAMP gravam no horario de Brasilia
# (as colunas sao DATETIME, que nao convertem fuso).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vantix?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=-03:00&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JWT (chave com pelo menos 32 caracteres; validade em horas). Em producao, defina JWT_SECRET.
vantix.jwt.secret=${JWT_SECRET:vantix-tech-store-chave-secreta-do-projeto-2026}
vantix.jwt.horas=8

# Origens do Angular liberadas no CORS (separe varias por virgula)
vantix.cors.origem=${CORS_ORIGEM:http://localhost:4200}

spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false
