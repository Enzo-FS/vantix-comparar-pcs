server.port=8080

# Banco de dados (rode database/01_estrutura.sql e 02_dados.sql antes)
spring.datasource.url=jdbc:mysql://localhost:3306/vantix_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
# Coloque aqui a senha do seu MySQL (ou defina a variavel de ambiente DB_PASSWORD)
spring.datasource.password=${DB_PASSWORD:root}

# JWT (chave com pelo menos 32 caracteres; validade em horas)
vantix.jwt.secret=${JWT_SECRET:vantix-tech-store-chave-secreta-do-projeto-2026}
vantix.jwt.horas=8

# Origem do Angular liberada no CORS
vantix.cors.origem=http://localhost:4200

spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false
